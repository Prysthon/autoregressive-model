[project]
name = "manchas-solares-autorregressao"
version = "0.1.0"
description = "Modelagem autorregressiva da atividade solar anual"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "ipykernel>=6.29",
    "matplotlib>=3.9",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "numpy>=2.0",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
notebook = ["jupyterlab>=4.3"]

[tool.uv]
package = false
